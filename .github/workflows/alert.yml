name: chart-alert

on:
  schedule:
    - cron: "*/5 * * * *"      # 5分ごと（GitHubの都合で数分遅れることがあります）
    - cron: "0 0 1 * *"        # 毎月1日：止まらないための書き込み
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知を送る"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: chart-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q yfinance pandas requests

      - name: Check charts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py
          fi

      - name: Monthly keepalive
        if: github.event.schedule == '0 0 1 * *'
        run: date -u +%Y-%m-%dT%H:%M:%SZ > keepalive.txt

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state.json keepalive.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "update state"
            git pull -q --rebase && git push -q
          fi
